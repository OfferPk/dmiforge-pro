<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f1726"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#1c2b42"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#ffffff">DMIForge Pro — System Architecture</text>
  <text x="40" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#00e5ff">CCSDS 766.1-B DIGITAL MOTION IMAGERY (DMI) MULTIPLEXING PIPELINE</text>

  <!-- Spacecraft Segment -->
  <rect x="40" y="100" width="440" height="460" rx="8" fill="url(#cardGrad)" stroke="#243552" stroke-width="1.5" />
  <rect x="40" y="100" width="440" height="35" rx="8" fill="#111c2e" />
  <text x="55" y="123" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1. Spacecraft Flight Video & Telemetry Payload</text>

  <!-- Encoders -->
  <rect x="60" y="150" width="395" height="70" rx="6" fill="#0b111c" stroke="#2979ff" stroke-width="1" />
  <text x="75" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2979ff">Optical Gimbal / Crew Camera Sensors</text>
  <text x="75" y="195" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• H.264/AVC High Profile Level 4.1 (1080p @ 30 FPS)</text>
  <text x="75" y="210" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">• Closed-GOP (GOP &le; 30, IDR Periodic Refresh)</text>

  <rect x="60" y="235" width="395" height="60" rx="6" fill="#0b111c" stroke="#00e676" stroke-width="1" />
  <text x="75" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e676">Audio Intercom & Cabin Microphones</text>
  <text x="75" y="278" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• MPEG-4 AAC-LC (48 kHz Aerospace Sampling Rate)</text>

  <rect x="60" y="310" width="395" height="60" rx="6" fill="#0b111c" stroke="#ffab00" stroke-width="1" />
  <text x="75" y="333" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffab00">Flight Navigation & Gimbal Telemetry</text>
  <text x="75" y="353" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Synchronous KLV Metadata (SMPTE RP 210 / MISB)</text>

  <!-- MPEG-2 TS Multiplexer -->
  <rect x="60" y="385" width="395" height="150" rx="6" fill="#060b14" stroke="#00e5ff" stroke-width="1.5" />
  <text x="75" y="410" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#00e5ff">MPEG-2 Transport Stream Multiplexer (ISO/IEC 13818-1)</text>
  <text x="75" y="430" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• 188-Byte Fixed Packets | Sync Byte: 0x47 Alignment</text>
  <text x="75" y="448" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• PAT (0x0000) & PMT (0x1000) with 32-bit MPEG CRC</text>
  <text x="75" y="466" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• Video PID 0x1011 | Audio PID 0x1012 | KLV PID 0x1013</text>
  <text x="75" y="484" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• 27 MHz Program Clock Reference (PCR &le; 100 ms Interval)</text>
  <text x="75" y="502" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">• 90 kHz Presentation Time Stamp (PTS) Sync Coupling</text>

  <!-- Downlink Arrow -->
  <path d="M 480 340 L 530 340" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6,4" />
  <polygon points="530,335 540,340 530,345" fill="#00e5ff" />
  <text x="485" y="330" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e5ff">7-TS RTP</text>

  <!-- Network & Ground Segment -->
  <rect x="540" y="100" width="420" height="460" rx="8" fill="url(#cardGrad)" stroke="#243552" stroke-width="1.5" />
  <rect x="540" y="100" width="420" height="35" rx="8" fill="#111c2e" />
  <text x="555" y="123" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2. Network Encapsulation & Ground Station</text>

  <!-- RFC 2250 RTP Frame Box -->
  <rect x="560" y="150" width="375" height="150" rx="6" fill="#0b111c" stroke="#ffab00" stroke-width="1.5" />
  <text x="575" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffab00">RFC 2250 / RFC 3550 RTP Encapsulation</text>
  <text x="575" y="195" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Payload Type: 33 (MP2T)</text>
  <text x="575" y="213" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">• Exactly 7 TS Packets = 1,316 Payload Octets</text>
  <text x="575" y="231" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• 12-Byte Standard RTP Header (Sequence + 90 kHz Clock)</text>
  <text x="575" y="249" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e5ff">• Total UDP Datagram = 1,328 Octets (MTU Safe &lt; 1500)</text>
  <text x="575" y="267" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• Zero IP Fragmentation Across Space Inter-Networks</text>

  <!-- Space Link Integration -->
  <rect x="560" y="315" width="375" height="100" rx="6" fill="#0b111c" stroke="#2979ff" stroke-width="1" />
  <text x="575" y="340" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2979ff">CCSDS Space Link Protocol Mapping (§4.2)</text>
  <text x="575" y="360" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• AOS / USLP Dedicated Virtual Channel (VC-3 Video)</text>
  <text x="575" y="378" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Space Packet Protocol (SPP) APID Binding (0x0150)</text>
  <text x="575" y="396" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Priority Queuing Isolated from Telecommand Link</text>

  <!-- Ground Demux & Player -->
  <rect x="560" y="430" width="375" height="105" rx="6" fill="#0b111c" stroke="#00e676" stroke-width="1" />
  <text x="575" y="455" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e676">Mission Control Flight Video Console</text>
  <text x="575" y="475" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Closed-GOP Rapid Resync on RF Dropout (&lt; 1 sec)</text>
  <text x="575" y="493" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Telemetry Overlay with Microsecond KLV Alignment</text>
  <text x="575" y="511" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• 10/10 Normative Compliance Auditor Verified</text>
</svg>
